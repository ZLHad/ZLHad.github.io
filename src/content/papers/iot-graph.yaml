title: Research on Graph Learning-Based Co-Inference Method for Space-Air-Ground Integrated Networks
titleZh: 基于图学习的空天地一体化网络合作推理方法研究
authors: [Yukai Xu, Bo Xu, Linghao Zhang, Qin Wang, Haitao Zhao]
