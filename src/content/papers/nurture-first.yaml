summary:
  en: Expert knowledge is tacit and keeps changing, so this essay proposes growing an agent through everyday conversation with its user and periodically distilling those conversations into reusable knowledge.
  zh: 专家知识大多是隐性的，而且一直在变。本文提出让智能体在与使用者的日常对话中逐步养成，并定期把对话沉淀为可复用的知识资产。
