title: Joint Task Offloading and Trajectory Optimization for Cooperative Multi-Branch DNN Inference in CR-SAGIN-Enhanced IoV
authors: [Bo Xu, Suyao Huang, Yukai Xu, Mengru Wu, Linghao Zhang, Jinlong Sun, Haitao Zhao]
venue: IEEE Transactions on Vehicular Technology
venueShort: IEEE TVT
