title: Token-Aware QoE Optimization for Multimodal AIGC Inference Tasks in Space-Air-Ground Integrated Networks
authors: [Linghao Zhang, Bo Xu, Haitao Zhao, Jinlong Sun, Jun Xiong, Xianbin Wang]
venue: IEEE Transactions on Mobile Computing
venueShort: IEEE TMC
kind: journal
