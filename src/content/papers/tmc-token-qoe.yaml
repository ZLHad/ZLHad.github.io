summary:
  en: "Takes communication-computing design from the task level to the token level: input, visual and output tokens describe a multimodal request, and slow planning with fast scheduling balances latency, quality and experience."
  zh: 把通算协同的粒度从任务级细化到 Token 级：用输入、视觉和输出 Token 刻画多模态推理工作量，慢时标规划、快时标调度，兼顾响应速度、推理质量和业务体验。
dossier: true
abstract:
  en: "The space-air-ground integrated network (SAGIN) can provide ubiquitous multimodal artificial intelligence-generated content (AIGC) services. In SAGIN, lightweight task-specific models hosted on uncrewed aerial vehicles (UAVs) provide low-latency inference, while full-scale foundation models deployed on low Earth orbit (LEO) satellites provide high-quality inference. However, efficient AIGC inference in SAGIN is hindered by the tight coupling between computation and cross-tier transmission under multi-timescale network dynamics. In this paper, we maximize the long-term per-user quality of experience (QoE), which captures both the generation quality and the end-to-end streaming latency of heterogeneous multimodal AIGC requests. To this end, we develop a unified token-level latency model that characterizes the time-to-first-token (TTFT) and the time-per-output-token (TPOT) along multi-tier offloading paths. We then formulate the joint optimization of model caching, UAV deployment, inference offloading, semantic compression, and resource allocation as a two-timescale mixed-integer nonlinear program (MINLP). For the slow-timescale subproblem, a knowledge-driven planner generates and evaluates candidate UAV deployment and model caching configurations from historical demand priors. For the fast-timescale subproblem, we propose a conditional diffusion twin delayed deep deterministic policy gradient (CD-TD3) algorithm with a hybrid action space, which optimizes offloading decisions, compression ratios, and resource allocation in real time. Simulation results show that the proposed framework improves the per-user QoE by 31.9% over TD3 and by 69.2% over the Greedy heuristic."
