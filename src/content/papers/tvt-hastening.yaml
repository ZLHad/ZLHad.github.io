title: "Hastening Co-Inference in Space-Air-Ground Integrated Networks: A Submodular Optimization Based Task Offloading Approach"
authors: [Haitao Zhao, Suyao Huang, Bo Xu, Linghao Zhang, Mengru Wu, Jinlong Sun]
venue: IEEE Transactions on Vehicular Technology
