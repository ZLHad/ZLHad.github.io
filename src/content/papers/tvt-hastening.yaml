summary:
  en: Neural-network inference is split across ground devices, UAVs and a satellite, and a submodular-optimization algorithm picks the split points, associations and resources.
  zh: 把神经网络推理分割到地面设备、无人机和卫星上，用子模优化算法选择分割点、设备关联和资源分配。
abstract:
  en: "Space-Air-Ground Integrated Networks (SAGINs) play a crucial role in the 6G system, offering global coverage and ultra-wide-area broadband access. Meanwhile, advancements in artificial intelligence (AI) have led to a significant increase in model inference demands with stringent latency requirements. In this paper, considering the intelligent services in SAGINs, we explore task offloading for the co-inference problem and improve the inference efficiency by performing model splitting, device association, and resource allocation. This problem is solved iteratively by decomposing it into multiple sub-problems. In particular, the bandwidth allocation problem is solved using convex optimization techniques to obtain a closed-form solution, and the model splitting problem is addressed by systematically searching for the optimal split points. Besides, the joint device association and computing resource allocation problem is reformulated into a monotone submodular function without the satellite, and a low-complexity submodular optimization algorithm is proposed. To further utilize the computing power of the satellite, we introduce a resource reallocation algorithm based on the existing optimization results. These sub-problems iterate alternately until the optimization goal converges. The simulation results show that the proposed algorithm can achieve better latency performance in several inference tasks."
